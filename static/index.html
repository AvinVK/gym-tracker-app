<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>Gym Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏋️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="onboarding-modal" class="modal-overlay" hidden>
  <div class="modal-card">
    <h2>Welcome 👋</h2>
    <p class="modal-sub">Let's set up your profile before you get started.</p>
    <form id="form-onboarding" class="grid-form">
      <label class="full">Name
        <input type="text" name="name" placeholder="Your name" required>
      </label>
      <label>Age
        <input type="number" name="age" min="1" max="120" placeholder="Age" required>
      </label>
      <label>Last Period Date
        <div class="date-field" data-date-field data-max="today">
          <button type="button" class="date-field-btn">
            <span class="date-field-value placeholder">dd-mm-yyyy</span>
            <span class="date-field-icon" aria-hidden="true">📅</span>
          </button>
          <input type="hidden" name="last_period_date" required>
        </div>
      </label>
      <button type="submit" class="primary">Continue</button>
    </form>
  </div>
</div>

<div id="confirm-modal" class="modal-overlay" hidden>
  <div class="modal-card">
    <h2>Confirm</h2>
    <p class="modal-sub" id="confirm-modal-message"></p>
    <div class="confirm-actions">
      <button type="button" class="secondary" id="confirm-modal-cancel">Cancel</button>
      <button type="button" class="primary" id="confirm-modal-ok">Yes, Save</button>
    </div>
  </div>
</div>

<div id="date-picker-modal" class="modal-overlay" hidden>
  <div class="modal-card date-picker-card">
    <div class="date-picker-header">
      <button type="button" class="date-picker-nav" id="dp-prev" aria-label="Previous month">&#8249;</button>
      <span id="dp-month-label"></span>
      <button type="button" class="date-picker-nav" id="dp-next" aria-label="Next month">&#8250;</button>
    </div>
    <div class="date-picker-weekdays">
      <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
    </div>
    <div class="date-picker-grid" id="dp-grid"></div>
    <button type="button" class="secondary" id="dp-cancel">Cancel</button>
  </div>
</div>

<header class="topbar">
  <div class="user-menu" id="user-menu" hidden>
    <button type="button" class="topbar-greeting" id="user-greeting-btn">
      <span id="user-greeting-text"></span>
      <span class="caret">&#9662;</span>
    </button>
    <div class="user-menu-dropdown" id="user-menu-dropdown" hidden>
      <button type="button" id="view-profile-btn">View Profile</button>
    </div>
  </div>
  <h1><span class="topbar-icon">🏋️</span>Gym Tracker</h1>
  <p class="topbar-sub">Log it. Track it. Crush it.</p>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-tab="log">Log Workout</button>
  <button class="tab-btn" data-tab="history">History</button>
</nav>

<main>
  <!-- ================= LOG WORKOUT ================= -->
  <section id="tab-log" class="tab-panel active">
    <div class="card">
      <h2>Log a Gym Visit</h2>
      <form id="form-workout" class="grid-form">
        <label>Date
          <div class="date-field" data-date-field data-max="today">
            <button type="button" class="date-field-btn">
              <span class="date-field-value placeholder">dd-mm-yyyy</span>
              <span class="date-field-icon" aria-hidden="true">📅</span>
            </button>
            <input type="hidden" name="date" id="workout-date" required>
          </div>
        </label>
        <label>Start Time
          <div class="time-select" data-time-group>
            <select class="time-hour" aria-label="Hour"></select>
            <span class="time-sep">:</span>
            <select class="time-minute" aria-label="Minute"></select>
            <select class="time-ampm" aria-label="AM or PM">
              <option value="AM">AM</option>
              <option value="PM">PM</option>
            </select>
            <input type="hidden" name="start_time">
          </div>
        </label>
        <label>End Time
          <div class="time-select" data-time-group>
            <select class="time-hour" aria-label="Hour"></select>
            <span class="time-sep">:</span>
            <select class="time-minute" aria-label="Minute"></select>
            <select class="time-ampm" aria-label="AM or PM">
              <option value="AM">AM</option>
              <option value="PM">PM</option>
            </select>
            <input type="hidden" name="end_time">
          </div>
        </label>
        <label>Energy Level
          <input type="number" name="energy_level" min="1" max="10" placeholder="1-10">
        </label>
        <label class="full">Notes
          <input type="text" name="notes" placeholder="optional">
        </label>
        <button type="submit" class="primary">Save Visit and Add Exercises Done</button>
      </form>
    </div>

    <div class="card" id="card-exlog" hidden>
      <h2>Log Exercises Done</h2>
      <form id="form-exercise-log" class="grid-form">
        <label class="full">Date
          <div class="date-field" data-date-field data-max="today">
            <button type="button" class="date-field-btn">
              <span class="date-field-value placeholder">dd-mm-yyyy</span>
              <span class="date-field-icon" aria-hidden="true">📅</span>
            </button>
            <input type="hidden" name="date" id="exlog-date" required>
          </div>
        </label>
        <div class="full" id="exlog-exercises"></div>
        <button type="button" id="exlog-add-exercise" class="secondary">+ Add Exercise</button>
        <button type="submit" class="primary">Save Exercises</button>
      </form>
    </div>
  </section>

  <!-- ================= HISTORY ================= -->
  <section id="tab-history" class="tab-panel">
    <div class="card" id="card-workout-log">
      <h2>Workout Log</h2>
      <div class="table-scroll">
        <table class="data-table" id="table-workout-log">
          <thead>
            <tr><th>Date</th><th>Start</th><th>End</th><th>Duration</th><th>Energy Level</th><th>Notes</th><th></th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="card" id="card-exercise-detail" hidden>
      <div class="card-header-row">
        <h2 id="exercise-detail-title">Exercises Done</h2>
        <button type="button" class="secondary back-btn" id="exercise-detail-back">&larr; Back</button>
      </div>
      <div class="table-scroll">
        <table class="data-table" id="table-exercise-log">
          <thead>
            <tr><th>Muscle Group</th><th>Exercise</th><th>Set #</th><th>Reps</th><th>Weight (kg)</th><th>Notes</th><th></th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- ================= PROFILE ================= -->
  <section id="tab-profile" class="tab-panel">
    <div class="card">
      <div class="card-header-row">
        <h2>Profile</h2>
        <button type="button" class="secondary back-btn" id="profile-back">&larr; Back</button>
      </div>
      <div class="profile-avatar-row">
        <img id="profile-avatar-img" class="profile-avatar" src="" alt="Profile picture" hidden>
        <div id="profile-avatar-placeholder" class="profile-avatar profile-avatar-placeholder"></div>
        <label class="secondary profile-upload-btn">
          Change Photo
          <input type="file" id="profile-avatar-input" accept="image/*" hidden>
        </label>
      </div>
      <form id="form-profile" class="grid-form">
        <label class="full">Name
          <input type="text" name="name" id="profile-name" required>
        </label>
        <label>Age
          <input type="number" name="age" id="profile-age" min="1" max="120">
        </label>
        <label>Last Period Date
          <div class="date-field" data-date-field data-max="today">
            <button type="button" class="date-field-btn">
              <span class="date-field-value placeholder">dd-mm-yyyy</span>
              <span class="date-field-icon" aria-hidden="true">📅</span>
            </button>
            <input type="hidden" name="last_period_date" id="profile-last-period">
          </div>
        </label>
        <button type="submit" class="primary">Save Changes</button>
      </form>
    </div>
  </section>
</main>

<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
